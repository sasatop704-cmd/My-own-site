<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Поймай монетки</title>

<style>

/* ===== УБИРАЕМ ВЫДЕЛЕНИЕ И СИСТЕМНЫЕ ЭФФЕКТЫ ===== */

* {
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;
}

body {
    background: #111827;
    color: white;

    font-family: Arial, sans-serif;

    text-align: center;
}


/* ===== ЗАГОЛОВОК ===== */

h1 {
    font-size: 26px;

    margin: 12px 0 4px;

    pointer-events: none;
}


/* ===== СЧЁТ ===== */

#score {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 8px;

    pointer-events: none;
}


/* ===== ИГРОВОЕ ПОЛЕ ===== */

#game {
    position: relative;

    width: min(94vw, 420px);

    height: min(68vh, 620px);

    min-height: 420px;

    margin: auto;

    overflow: hidden;

    background:
        linear-gradient(
            #38bdf8,
            #dbeafe
        );

    border: 3px solid white;

    border-radius: 18px;

    touch-action: none;

    -webkit-user-select: none;
    user-select: none;
}


/* ===== ИГРОК ===== */

#player {
    position: absolute;

    bottom: 15px;

    left: calc(50% - 40px);

    width: 80px;
    height: 34px;

    background: #92400e;

    border-radius:
        0 0 40px 40px;

    pointer-events: none;
}


/* ===== МОНЕТКА ===== */

.coin {
    position: absolute;

    width: 32px;
    height: 32px;

    background: gold;

    border: 3px solid #f59e0b;

    border-radius: 50%;

    box-shadow:
        0 0 12px #facc15;

    pointer-events: none;
}


/* ===== ЭКРАН КОНЦА ===== */

#gameOver {
    display: none;

    position: absolute;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.75);

    align-items: center;

    justify-content: center;

    flex-direction: column;

    font-size: 28px;

    z-index: 10;

    touch-action: none;
}


/* ===== КНОПКА ПЕРЕЗАПУСКА ===== */

#restartButton {
    border: none;
    outline: none;

    padding: 14px 28px;

    margin-top: 14px;

    font-size: 20px;

    border-radius: 14px;

    background: #22c55e;

    color: white;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    -webkit-user-select: none;
    user-select: none;
}


/* Убираем синюю рамку */

#restartButton:focus,
#restartButton:active {
    outline: none;
    box-shadow: none;
}


/* ===== КНОПКИ УПРАВЛЕНИЯ ===== */

#controls {
    width: min(94vw, 420px);

    margin: 10px auto;

    display: flex;

    gap: 14px;

    touch-action: none;
}


.control {
    flex: 1;

    height: 70px;

    border: none;
    outline: none;

    border-radius: 18px;

    background: #374151;

    color: white;

    font-size: 32px;

    font-weight: bold;

    cursor: pointer;

    touch-action: none;

    -webkit-tap-highlight-color: transparent;

    -webkit-user-select: none;
    user-select: none;
}


/* Полностью убираем фокус */

.control:focus,
.control:active {
    outline: none;

    box-shadow: none;
}


/* Эффект нажатия */

.control:active {
    transform: scale(0.94);

    background: #4b5563;
}

</style>
</head>


<body>

<h1>🪙 Поймай монетки!</h1>

<div id="score">
    Счёт: 0
</div>


<div id="game">

    <div id="player"></div>


    <div id="gameOver">

        <div>
            Игра окончена!
        </div>

        <div id="finalScore">
        </div>

        <button id="restartButton">
            Играть снова
        </button>

    </div>

</div>


<div id="controls">

    <button
        class="control"
        id="left"
        type="button">
        ⬅️
    </button>

    <button
        class="control"
        id="right"
        type="button">
        ➡️
    </button>

</div>


<script>

/* ===== ЭЛЕМЕНТЫ ===== */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const restartButton =
    document.getElementById("restartButton");

const leftButton =
    document.getElementById("left");

const rightButton =
    document.getElementById("right");


/* ===== ПЕРЕМЕННЫЕ ===== */

let playerX = 0;

let score = 0;

let speed = 4;

let gameRunning = true;

let movingLeft = false;

let movingRight = false;


/* ===== ЗАПРЕЩАЕМ КОНТЕКСТНОЕ МЕНЮ ===== */

document.addEventListener(
    "contextmenu",
    function(e) {
        e.preventDefault();
    }
);


/* ===== ЗАПРЕЩАЕМ DRAG ===== */

document.addEventListener(
    "dragstart",
    function(e) {
        e.preventDefault();
    }
);


/* ===== УПРАВЛЕНИЕ ===== */

function startMoving(direction) {

    if (direction === "left") {
        movingLeft = true;
    }

    if (direction === "right") {
        movingRight = true;
    }
}


function stopMoving(direction) {

    if (direction === "left") {
        movingLeft = false;
    }

    if (direction === "right") {
        movingRight = false;
    }
}


/* ===== ЛЕВАЯ КНОПКА ===== */

leftButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        startMoving("left");

    },
    { passive: false }
);


leftButton.addEventListener(
    "pointerup",
    function(e) {

        e.preventDefault();

        stopMoving("left");

    },
    { passive: false }
);


leftButton.addEventListener(
    "pointercancel",
    function() {

        stopMoving("left");

    }
);


leftButton.addEventListener(
    "pointerleave",
    function() {

        stopMoving("left");

    }
);


/* ===== ПРАВАЯ КНОПКА ===== */

rightButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        startMoving("right");

    },
    { passive: false }
);


rightButton.addEventListener(
    "pointerup",
    function(e) {

        e.preventDefault();

        stopMoving("right");

    },
    { passive: false }
);


rightButton.addEventListener(
    "pointercancel",
    function() {

        stopMoving("right");

    }
);


rightButton.addEventListener(
    "pointerleave",
    function() {

        stopMoving("right");

    }
);


/* ===== ЕСЛИ ПАЛЕЦ УШЁЛ С ЭКРАНА ===== */

document.addEventListener(
    "pointerup",
    function() {

        movingLeft = false;

        movingRight = false;

    }
);


/* ===== КЛАВИАТУРА ===== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            e.preventDefault();

            movingLeft = true;
        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            e.preventDefault();

            movingRight = true;
        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            movingLeft = false;
        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            movingRight = false;
        }

    }
);


/* ===== ДВИЖЕНИЕ ИГРОКА ===== */

function gameLoop() {

    if (gameRunning) {

        if (movingLeft) {
            playerX -= 7;
        }

        if (movingRight) {
            playerX += 7;
        }


        /* Границы */

        playerX = Math.max(
            0,
            Math.min(
                game.clientWidth - 80,
                playerX
            )
        );


        player.style.left =
            playerX + "px";
    }


    requestAnimationFrame(gameLoop);
}


/* ===== СОЗДАНИЕ МОНЕТКИ ===== */

function createCoin() {

    if (!gameRunning) {
        return;
    }


    const coin =
        document.createElement("div");

    coin.className = "coin";


    coin.style.left =
        Math.random() *
        (game.clientWidth - 32) +
        "px";


    coin.style.top =
        "-35px";


    game.appendChild(coin);


    let y = -35;


    const fall =
        setInterval(function() {

            if (!gameRunning) {

                clearInterval(fall);

                coin.remove();

                return;
            }


            y += speed;


            coin.style.top =
                y + "px";


            const coinX =
                coin.offsetLeft;

            const playerY =
                player.offsetTop;


            /* Поймали монетку */

            if (
                y + 32 >= playerY &&
                y <= playerY + 34 &&
                coinX + 32 >= playerX &&
                coinX <= playerX + 80
            ) {

                score++;


                scoreText.textContent =
                    "Счёт: " + score;


                /* Каждые 5 монет быстрее */

                if (score % 5 === 0) {
                    speed += 0.5;
                }


                coin.remove();

                clearInterval(fall);

                return;
            }


            /* Монетка упала */

            if (
                y > game.clientHeight
            ) {

                clearInterval(fall);

                coin.remove();

                gameOver();
            }

        }, 20);
}


/* ===== КОНЕЦ ИГРЫ ===== */

function gameOver() {

    gameRunning = false;

    movingLeft = false;

    movingRight = false;


    finalScore.textContent =
        "Твой счёт: " + score;


    gameOverScreen.style.display =
        "flex";
}


/* ===== ПЕРЕЗАПУСК ===== */

function restart() {

    document
        .querySelectorAll(".coin")
        .forEach(function(coin) {

            coin.remove();

        });


    score = 0;

    speed = 4;

    gameRunning = true;


    playerX =
        (game.clientWidth - 80) / 2;


    player.style.left =
        playerX + "px";


    scoreText.textContent =
        "Счёт: 0";


    gameOverScreen.style.display =
        "none";
}


/* ===== КНОПКА RESTART ===== */

restartButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

    },
    { passive: false }
);


restartButton.addEventListener(
    "click",
    function(e) {

        e.preventDefault();

        restart();

    }
);


/* ===== СТАРТ ===== */

playerX =
    (game.clientWidth - 80) / 2;


player.style.left =
    playerX + "px";


setInterval(
    createCoin,
    800
);


gameLoop();

</script>

</body>
</html>
